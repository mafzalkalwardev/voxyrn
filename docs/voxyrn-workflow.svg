<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Voxyrn sales automation workflow</title>
  <desc id="desc">Campaign contacts flow through dialing, call-state and voicemail detection, realtime conversation, and CRM follow-up.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2340"/>
      <stop offset="1" stop-color="#1A3A5C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0C2340" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0891B2"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="#F8FAFC"/>
  <rect width="1400" height="116" fill="url(#header)"/>
  <circle cx="70" cy="58" r="28" fill="none" stroke="#22D3EE" stroke-width="8"/>
  <path d="M70 87V38c0-6 5-11 11-11h20c13 0 23 10 23 23s-10 23-23 23H70l30 32"
        fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="87" r="7" fill="#25D366"/>
  <text x="120" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Voxyrn workflow</text>
  <text x="120" y="83" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#BAE6FD">Always-on campaign execution, realtime voice intelligence, and follow-up</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="60" y="178" width="220" height="116" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    <rect x="330" y="178" width="220" height="116" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    <rect x="600" y="178" width="220" height="116" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    <rect x="870" y="178" width="220" height="116" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    <rect x="1140" y="178" width="200" height="116" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>

    <circle cx="98" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="368" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="638" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="908" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="1178" cy="216" r="17" fill="url(#accent)"/>
    <g fill="#FFFFFF" text-anchor="middle" font-size="15" font-weight="800">
      <text x="98" y="221">1</text><text x="368" y="221">2</text><text x="638" y="221">3</text>
      <text x="908" y="221">4</text><text x="1178" y="221">5</text>
    </g>
    <g fill="#0C2340" font-size="18" font-weight="800">
      <text x="88" y="259">Campaign queue</text>
      <text x="358" y="259">Dial &amp; connect</text>
      <text x="628" y="259">Detect outcome</text>
      <text x="898" y="259">Realtime dialogue</text>
      <text x="1170" y="259">Follow-up</text>
    </g>
    <g fill="#475569" font-size="14">
      <text x="88" y="280">Contacts, rules, timing</text>
      <text x="358" y="280">Browser calling route</text>
      <text x="628" y="280">Human, voicemail, failed</text>
      <text x="898" y="280">STT → LLM → TTS</text>
      <text x="1170" y="280">CRM, logs, next action</text>
    </g>
  </g>

  <g fill="none" stroke="#0891B2" stroke-width="4" marker-end="url(#arrow)">
    <path d="M280 236H320"/>
    <path d="M550 236H590"/>
    <path d="M820 236H860"/>
    <path d="M1090 236H1130"/>
  </g>

  <rect x="175" y="382" width="1050" height="142" rx="24" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
  <text x="210" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#0C2340">Conversation loop</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#164E63">
    <text x="210" y="457">Audio capture</text>
    <text x="440" y="457">VAD endpointing</text>
    <text x="680" y="457">Speech-to-text</text>
    <text x="900" y="457">AI response</text>
    <text x="1100" y="457">Voice playback</text>
  </g>
  <g fill="none" stroke="#0891B2" stroke-width="3" marker-end="url(#arrow)">
    <path d="M335 450H420"/>
    <path d="M570 450H660"/>
    <path d="M810 450H880"/>
    <path d="M1015 450H1080"/>
  </g>
  <text x="210" y="493" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#0E7490">Barge-in aware playback • voicemail message preparation • complete call audit trail</text>
</svg>
