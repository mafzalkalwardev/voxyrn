<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Voxyrn sales automation workflow</title>
  <desc id="desc">Campaign contacts flow through dialing, call-state and voicemail detection, realtime conversation, and CRM follow-up.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1410"/>
      <stop offset="1" stop-color="#3A2A22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E36A2E"/>
      <stop offset="1" stop-color="#C6531A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1C1410" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#C6531A"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="#F6F1EA"/>
  <rect width="1400" height="116" fill="url(#header)"/>
  <rect x="42" y="30" width="56" height="56" rx="14" fill="#2A1C16"/>
  <path d="M50 66c5-10 8-10 13 0s8 10 13 0" fill="none" stroke="#F6F1EA" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 46l10 10-10 10" fill="none" stroke="#E36A2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Voxyrn workflow</text>
  <text x="120" y="83" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#F3D2C2">Always-on campaign execution, realtime voice intelligence, and follow-up</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="60" y="178" width="220" height="116" rx="18" fill="#FFFCF8" stroke="#E4D8CC" stroke-width="2"/>
    <rect x="330" y="178" width="220" height="116" rx="18" fill="#FFFCF8" stroke="#E4D8CC" stroke-width="2"/>
    <rect x="600" y="178" width="220" height="116" rx="18" fill="#FFFCF8" stroke="#E4D8CC" stroke-width="2"/>
    <rect x="870" y="178" width="220" height="116" rx="18" fill="#FFFCF8" stroke="#E4D8CC" stroke-width="2"/>
    <rect x="1140" y="178" width="200" height="116" rx="18" fill="#FFFCF8" stroke="#E4D8CC" stroke-width="2"/>

    <circle cx="98" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="368" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="638" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="908" cy="216" r="17" fill="url(#accent)"/>
    <circle cx="1178" cy="216" r="17" fill="url(#accent)"/>
    <g fill="#FFFFFF" text-anchor="middle" font-size="15" font-weight="800">
      <text x="98" y="221">1</text><text x="368" y="221">2</text><text x="638" y="221">3</text>
      <text x="908" y="221">4</text><text x="1178" y="221">5</text>
    </g>
    <g fill="#1C1410" font-size="18" font-weight="800">
      <text x="88" y="259">Campaign queue</text>
      <text x="358" y="259">Dial &amp; connect</text>
      <text x="628" y="259">Detect outcome</text>
      <text x="898" y="259">Realtime dialogue</text>
      <text x="1170" y="259">Follow-up</text>
    </g>
    <g fill="#6B5C52" font-size="14">
      <text x="88" y="280">Contacts, rules, timing</text>
      <text x="358" y="280">Browser calling route</text>
      <text x="628" y="280">Human, voicemail, failed</text>
      <text x="898" y="280">STT → LLM → TTS</text>
      <text x="1170" y="280">CRM, logs, next action</text>
    </g>
  </g>

  <g fill="none" stroke="#C6531A" stroke-width="4" marker-end="url(#arrow)">
    <path d="M280 236H320"/>
    <path d="M550 236H590"/>
    <path d="M820 236H860"/>
    <path d="M1090 236H1130"/>
  </g>

  <rect x="175" y="382" width="1050" height="142" rx="24" fill="#F8EFE6" stroke="#E7C4B0" stroke-width="2"/>
  <text x="210" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#1C1410">Conversation loop</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#6B3A28">
    <text x="210" y="457">Audio capture</text>
    <text x="440" y="457">VAD endpointing</text>
    <text x="680" y="457">Speech-to-text</text>
    <text x="900" y="457">AI response</text>
    <text x="1100" y="457">Voice playback</text>
  </g>
  <g fill="none" stroke="#C6531A" stroke-width="3" marker-end="url(#arrow)">
    <path d="M335 450H420"/>
    <path d="M570 450H660"/>
    <path d="M810 450H880"/>
    <path d="M1015 450H1080"/>
  </g>
  <text x="210" y="493" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8A3E16">Barge-in aware playback • voicemail message preparation • complete call audit trail</text>
</svg>
