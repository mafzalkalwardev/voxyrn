# PipeWire 1.0 drop-in. Install to
# /etc/pipewire/pipewire.conf.d/voxyrn-sinks.conf
# Null sinks are created when the daemon starts, with idle-suspend disabled.
# pactl load-module must use space-separated sink_properties; commas are
# folded into device.description and do not set these flags.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "voxyrn_to_gv"
            node.description = "Voxyrn TTS to Google Voice"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            node.suspend-on-idle = false
            node.passive = false
            session.suspend-timeout-seconds = 0
            object.linger = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "voxyrn_from_gv"
            node.description = "Voxyrn Google Voice speaker"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            node.suspend-on-idle = false
            node.passive = false
            session.suspend-timeout-seconds = 0
            object.linger = true
        }
    }
]
