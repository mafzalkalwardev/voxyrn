# Site for voxyrn.induswebagency.com
# Install:
#   sudo cp deploy/linux/nginx/voxyrn-upgrade.conf /etc/nginx/conf.d/voxyrn-upgrade.conf
#   sudo cp deploy/linux/nginx/voxyrn.conf /etc/nginx/sites-available/voxyrn
#   sudo ln -sfn /etc/nginx/sites-available/voxyrn /etc/nginx/sites-enabled/voxyrn
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d voxyrn.induswebagency.com
#
# The app listens on 127.0.0.1:8787. TLS stops at nginx.
# /api/run/stream is server-sent events, so buffering stays off.
# The upgrade map covers a WebSocket if one is added later.

server {
    listen 80;
    listen [::]:80;
    server_name voxyrn.induswebagency.com;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
