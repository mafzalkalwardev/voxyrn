name: Tests

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; src=Path('requirements.txt').read_text(encoding='utf-8'); Path('requirements-ci.txt').write_text(''.join(line for line in src.splitlines(True) if not line.startswith('llama-cpp-python')), encoding='utf-8')"
          pip install -r requirements-ci.txt
          pip install "pytest>=8.0,<9" "pytest-mock>=3.12,<4"

      - name: Run tests
        env:
          # Tests mock external calls. A local GGUF build is optional and is not installed here.
          GROQ_API_KEY: test_key_ci_placeholder
          GROQ_MODEL: llama-3.3-70b-versatile
          LOOPBACK_DEVICE: CABLE Input
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: logs/
          if-no-files-found: ignore
