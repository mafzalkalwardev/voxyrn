name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          grep -v '^llama-cpp-python' requirements-linux.txt > /tmp/voxyrn-reqs.txt
          pip install -r /tmp/voxyrn-reqs.txt
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.83.0
      - name: Test the Rust audio core
        run: |
          cargo test --manifest-path rust/Cargo.toml
          cargo build --manifest-path rust/Cargo.toml -p voxyrn-py
      - name: Byte-compile Python
        run: |
          python -m compileall -q src tests
      - name: Run tests
        run: |
          python -m pip install "pytest>=8.0,<9" "pytest-mock>=3.12,<4"
          python -m pytest tests -q --tb=line

  test-groq:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Decide whether a live Groq check can run
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "GROQ_API_KEY is not configured; skipping the live Groq check."
          fi
      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          grep -v '^llama-cpp-python' requirements-linux.txt > /tmp/voxyrn-reqs.txt
          pip install -r /tmp/voxyrn-reqs.txt
      - name: Run Groq connectivity test
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_URL: ${{ secrets.GROQ_API_URL }}
        run: python -m src.test_groq
