name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          grep -v '^llama-cpp-python' requirements-linux.txt > /tmp/voxyrn-reqs.txt
          pip install -r /tmp/voxyrn-reqs.txt
      - name: Byte-compile Python
        run: |
          python -m compileall -q src tests

  test-groq:
    if: ${{ secrets.GROQ_API_KEY != '' }}
    runs-on: ubuntu-latest
    needs: lint
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_URL: ${{ secrets.GROQ_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          grep -v '^llama-cpp-python' requirements-linux.txt > /tmp/voxyrn-reqs.txt
          pip install -r /tmp/voxyrn-reqs.txt
      - name: Run Groq connectivity test
        run: python -m src.test_groq
